<svg xmlns="http://www.w3.org/2000/svg" width="840" height="56" viewBox="0 0 840 56" role="img" aria-label="01 — Proyectos destacados" fill="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>01 — Proyectos destacados</title>
<style>
@font-face{font-family:GM;font-weight:500;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:GS;font-weight:500;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:GM;font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}

.fu{animation:fu .7s cubic-bezier(0.23, 1, 0.32, 1) both}
.fi{animation:fi .9s cubic-bezier(0.23, 1, 0.32, 1) both}
.dr{stroke-dasharray:1;animation:dr 1.1s cubic-bezier(0.23, 1, 0.32, 1) both}
.pp{transform-box:fill-box;transform-origin:center;animation:pp .55s cubic-bezier(0.23, 1, 0.32, 1) both}
.sc{transform-box:fill-box;transform-origin:center;animation:sc .6s cubic-bezier(0.23, 1, 0.32, 1) both}
@keyframes fu{from{opacity:0;transform:translateY(10px)}}
@keyframes fi{from{opacity:0}}
@keyframes dr{from{stroke-dashoffset:1}}
@keyframes pp{from{opacity:0;transform:scale(.3)}}
@keyframes sc{from{opacity:0;transform:scale(.94)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

</style>
<defs></defs>
<text x="0.0" y="36.0" fill="#D4520E" class="fu" style="font-family:GM;font-weight:500;font-style:normal;font-size:12px;letter-spacing:0.04em;animation-delay:0.00s">01</text>
<text x="34.0" y="37.0" fill="#1F2328" class="fu" style="font-family:GS;font-weight:500;font-style:normal;font-size:22px;letter-spacing:-0.01em;animation-delay:0.06s">Proyectos destacados</text>
<text x="840.0" y="36.0" fill="#818B98" text-anchor="end" class="fu" style="font-family:GM;font-weight:400;font-style:normal;font-size:11px;letter-spacing:0.08em;animation-delay:0.12s">TRES PROYECTOS EN EQUIPO</text>
<line class="dr" style="animation-delay:.15s" x1="285.3" y1="31.5" x2="642.5" y2="31.5" stroke="#D8DEE4" pathLength="1"/>
</svg>
