<svg xmlns="http://www.w3.org/2000/svg" width="194" height="50" viewBox="0 0 194 50" role="img" aria-label="Ver portafolio" fill="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Ver portafolio</title>
<style>
@font-face{font-family:GS;font-weight:600;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}

.fu{animation:fu .7s cubic-bezier(0.23, 1, 0.32, 1) both}
.fi{animation:fi .9s cubic-bezier(0.23, 1, 0.32, 1) both}
.dr{stroke-dasharray:1;animation:dr 1.1s cubic-bezier(0.23, 1, 0.32, 1) both}
.pp{transform-box:fill-box;transform-origin:center;animation:pp .55s cubic-bezier(0.23, 1, 0.32, 1) both}
.sc{transform-box:fill-box;transform-origin:center;animation:sc .6s cubic-bezier(0.23, 1, 0.32, 1) both}
@keyframes fu{from{opacity:0;transform:translateY(10px)}}
@keyframes fi{from{opacity:0}}
@keyframes dr{from{stroke-dashoffset:1}}
@keyframes pp{from{opacity:0;transform:scale(.3)}}
@keyframes sc{from{opacity:0;transform:scale(.94)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.rv{animation:rv .9s cubic-bezier(0.23, 1, 0.32, 1) both}
@keyframes rv{from{opacity:0;transform:translateY(26px)}}
.sx{transform-box:fill-box;transform-origin:left center;animation:sx .9s cubic-bezier(0.23, 1, 0.32, 1) both}
@keyframes sx{from{transform:scaleX(0)}}
.seg{stroke-dasharray:1;animation:dr .34s cubic-bezier(0.77, 0, 0.175, 1) both}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 2.4s cubic-bezier(0.23, 1, 0.32, 1) infinite}
@keyframes ring{0%{opacity:.6;transform:scale(1)}70%,100%{opacity:0;transform:scale(2.8)}}
.blink{animation:blink 1.6s steps(1) infinite}
@keyframes blink{50%{opacity:.15}}

</style>
